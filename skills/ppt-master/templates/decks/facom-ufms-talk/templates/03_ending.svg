<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="facom_ufms_dark_master" data-pptx-master-name="FACOM/UFMS Dark"
  data-pptx-layout="ending" data-pptx-layout-name="Ending">
  <rect id="dark-master-background" x="0" y="0" width="1280" height="720" fill="#0088B7"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <image id="dark-master-grafo-motif" x="60" y="480" width="300" height="300"
    href="../../brands/facom-ufms/images/grafo_facom.png" opacity="0.12"
    preserveAspectRatio="xMidYMid meet"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="dark-master-bottom-rule" x="0" y="716" width="1280" height="4" fill="#FFFFFF"
    fill-opacity="0.35" data-pptx-layer="master" data-pptx-editable="false"/>

  <image id="ending-logo" x="540" y="120" width="200" height="96"
    href="../../brands/facom-ufms/images/ufms_logo_negativo.png"
    preserveAspectRatio="xMidYMid meet"
    data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="ending-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="200 300 880 72">
    <text id="ending-title-carrier" data-pptx-carrier="true"
      x="640" y="350" text-anchor="middle" fill="#FFFFFF"
      font-family="Inter, Arial, sans-serif"
      font-size="36" font-weight="700">{{CLOSING_TITLE}}</text>
  </g>
  <g id="ending-contact-slot" data-pptx-placeholder="body" data-pptx-idx="1"
    data-pptx-bounds="300 396 680 56">
    <text id="ending-contact-carrier" data-pptx-carrier="true"
      x="640" y="428" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.9"
      font-family="Inter, Arial, sans-serif" font-size="20">{{CONTACT}}</text>
  </g>
  <g id="ending-footer-slot" data-pptx-placeholder="footer" data-pptx-idx="2"
    data-pptx-bounds="300 452 680 32">
    <text id="ending-footer-carrier" data-pptx-carrier="true"
      x="640" y="474" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.7"
      font-family="Inter, Arial, sans-serif" font-size="16">{{AFFILIATION}}</text>
  </g>
</svg>
